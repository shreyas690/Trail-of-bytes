<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520">
  <rect width="900" height="520" fill="#020617"/>
  <text x="450" y="40" fill="#fbbf24" font-size="24" text-anchor="middle">Trial of Bytes Architecture</text>
  <rect x="60" y="80" width="200" height="140" fill="#0f172a" stroke="#38bdf8" rx="12"/>
  <text x="160" y="120" fill="#f8fafc" font-size="16" text-anchor="middle">React Client</text>
  <text x="160" y="150" fill="#94a3b8" font-size="12" text-anchor="middle">React Query + Socket.IO</text>
  <rect x="350" y="80" width="200" height="140" fill="#0f172a" stroke="#34d399" rx="12"/>
  <text x="450" y="120" fill="#f8fafc" font-size="16" text-anchor="middle">Express API</text>
  <text x="450" y="150" fill="#94a3b8" font-size="12" text-anchor="middle">Auth / Admin / Game</text>
  <rect x="640" y="80" width="200" height="140" fill="#0f172a" stroke="#f472b6" rx="12"/>
  <text x="740" y="120" fill="#f8fafc" font-size="16" text-anchor="middle">Socket.IO Server</text>
  <text x="740" y="150" fill="#94a3b8" font-size="12" text-anchor="middle">Lobby + Team Rooms</text>
  <rect x="200" y="300" width="200" height="140" fill="#0f172a" stroke="#fbbf24" rx="12"/>
  <text x="300" y="340" fill="#f8fafc" font-size="16" text-anchor="middle">MongoDB</text>
  <text x="300" y="370" fill="#94a3b8" font-size="12" text-anchor="middle">Teams / Session / Logs</text>
  <rect x="500" y="300" width="200" height="140" fill="#0f172a" stroke="#a855f7" rx="12"/>
  <text x="600" y="340" fill="#f8fafc" font-size="16" text-anchor="middle">Redis Cache</text>
  <text x="600" y="370" fill="#94a3b8" font-size="12" text-anchor="middle">Leaderboard TTL=10s</text>
  <line x1="260" y1="150" x2="350" y2="150" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="550" y1="150" x2="640" y2="150" stroke="#34d399" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="450" y1="220" x2="300" y2="300" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="450" y1="220" x2="600" y2="300" stroke="#a855f7" stroke-width="2" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L6,3 z" fill="#fbbf24"/>
    </marker>
  </defs>
  <text x="450" y="480" fill="#94a3b8" font-size="12" text-anchor="middle">
    Socket rooms: lobby (all teams) + team:{teamId}. API notifies Redis + Mongo. Redis pushes leaderboard snapshots.
  </text>
</svg>

